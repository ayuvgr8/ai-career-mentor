# Render Blueprint for the Rolevo web application.
# Keep the web service and database in the same region so DATABASE_URL uses
# Render's private network. Change both APP_ORIGIN and the Replit callback if
# you rename the service or attach a custom domain.
services:
  - type: web
    name: rolevo-career-mentor
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    # Migrations are idempotent and lock-guarded, so every boot can apply them.
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # This is the initial Render domain for the service name above.
      # Replace it with the HTTPS custom domain if one is later attached.
      - key: APP_ORIGIN
        value: https://rolevo-career-mentor.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: rolevo-db
          property: connectionString
      - key: AUTH_MODE
        value: replit
      - key: REPL_ID
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: CAREER_AI_MODEL
        value: gpt-5.6-terra
      # Add the optional AGENTICORG_* values in the Render dashboard only
      # after the real, owner-only approve/reject gate has passed.
      - key: AGENTICORG_VERIFIED
        value: "false"

databases:
  - name: rolevo-db
    databaseName: rolevo
    user: rolevo
    region: singapore
    plan: free
