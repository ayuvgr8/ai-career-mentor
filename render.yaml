# Render Blueprint for the Rolevo web application.
# Keep the web service and database in the same region so DATABASE_URL uses
# Render's private network. The app uses Render's automatic RENDER_EXTERNAL_URL
# as its public origin; set APP_ORIGIN only for a custom domain (and update the
# Replit callback to match).
services:
  - type: web
    name: rolevo-career-mentor
    runtime: node
    region: singapore
    plan: free
    # The lockfile needs pnpm 10 (older pnpm rejects its overrides, and pnpm 9
    # also drops devDependencies under NODE_ENV=production). Corepack activates
    # the version pinned in package.json's packageManager field.
    buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile && pnpm build
    # Migrations are idempotent and lock-guarded, so every boot can apply them.
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rolevo-db
          property: connectionString
      - key: AUTH_MODE
        value: replit
      - key: REPL_ID
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: CAREER_AI_MODEL
        value: gpt-5.6-terra
      # Add the optional AGENTICORG_* values in the Render dashboard only
      # after the real, owner-only approve/reject gate has passed.
      - key: AGENTICORG_VERIFIED
        value: "false"
      # Voice mentor (optional). Routes answer 503 until these are set.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: VOICE_VERIFIED
        value: "false"
      - key: AGENTICORG_AGENT_UUID
        sync: false
      - key: ADAPTER_SHARED_TOKEN
        sync: false

databases:
  - name: rolevo-db
    databaseName: rolevo
    user: rolevo
    region: singapore
    plan: free
